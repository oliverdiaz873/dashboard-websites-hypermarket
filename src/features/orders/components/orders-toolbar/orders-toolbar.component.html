<div class="flex flex-col gap-3">
  <div class="flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between">
    <div class="grid w-full gap-3 sm:grid-cols-2 lg:max-w-xl lg:grid-cols-3">
      <div class="sm:col-span-2">
        <app-search-input
          [value]="store.search()"
          placeholder="Buscar por cliente, email o ID de pedido…"
          (searchChange)="onSearch($event)"
        />
      </div>

      <app-filter-select
        label="Estado"
        [options]="statusOptions"
        [value]="store.status()"
        allLabel="Todos"
        (valueChange)="onStatus($event)"
      />

      <app-filter-select
        label="Ordenar"
        [options]="sortOptions"
        [value]="store.sortBy()"
        allLabel=""
        (valueChange)="onSortBy($event)"
      />
    </div>

    <div class="flex items-center gap-2">
      <button
        mat-icon-button
        type="button"
        (click)="toggleDirection()"
        [attr.aria-label]="'Cambiar dirección del orden'"
        [matTooltip]="store.sortOrder() === 'asc' ? 'Orden ascendente' : 'Orden descendente'"
      >
        <mat-icon>{{ store.sortOrder() === 'asc' ? 'arrow_upward' : 'arrow_downward' }}</mat-icon>
      </button>

      <button mat-icon-button type="button" (click)="store.refresh()" aria-label="Actualizar lista">
        <mat-icon>refresh</mat-icon>
      </button>
    </div>
  </div>

  <div class="flex flex-wrap items-center gap-2">
    <span
      class="inline-flex items-center gap-1.5 rounded-full border border-border bg-surface px-3 py-1 text-xs font-medium text-neutral-700 dark:text-neutral-300"
    >
      Total
      <strong>{{ store.total() }}</strong>
    </span>
  </div>
</div>
