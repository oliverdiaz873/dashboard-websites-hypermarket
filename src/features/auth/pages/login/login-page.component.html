<div class="login-page">
  <aside class="login-page__branding" aria-hidden="true">
    <div class="login-page__branding-glow"></div>
    <div class="login-page__blob login-page__blob--1"></div>
    <div class="login-page__blob login-page__blob--2"></div>
    <div class="login-page__grid"></div>

    <div class="login-page__branding-content">
      <img
        src="/assets/images/logo/logo-original.png"
        [alt]="appConfig.appName"
        class="login-page__logo"
        width="120"
        height="120"
        loading="eager"
      />
      <p class="login-page__eyebrow">Panel administrativo</p>
      <h1 class="login-page__branding-title">{{ appConfig.appName }}</h1>
      <p class="login-page__branding-tagline">Gestiona tu ecommerce desde un solo lugar</p>
    </div>
  </aside>

  <main class="login-page__form">
    <div class="login-page__card">
      <app-login-form />
    </div>
  </main>
</div>
