<div class="overflow-hidden rounded-lg border border-border bg-surface">
  <app-data-table
    [columns]="columns"
    [rows]="items()"
    [loading]="loading()"
    [actions]="actions"
    [selectable]="false"
    (actionClicked)="onAction($event)"
  >
    <div class="flex flex-col items-center justify-center gap-2 py-10 text-center">
      <mat-icon class="text-4xl text-muted">mail_outline</mat-icon>
      <p class="text-sm font-medium text-neutral-800 dark:text-neutral-200">{{ emptyTitle }}</p>
      <p class="text-sm text-muted">{{ emptyMessage }}</p>
    </div>
  </app-data-table>
</div>
