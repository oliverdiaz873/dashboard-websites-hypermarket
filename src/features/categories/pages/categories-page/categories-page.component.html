<div class="flex h-full flex-col gap-5 p-4 sm:p-6">
  <app-page-header title="Categorías" subtitle="Gestión del catálogo de categorías y subcategorías">
    <button
      type="button"
      class="page-header-add inline-flex items-center gap-2 rounded-md bg-brand-600 px-3 py-2 text-sm font-medium text-white transition-colors hover:bg-brand-700"
      (click)="openCreate()"
    >
      <mat-icon aria-hidden="true">add</mat-icon>
      <span>Nueva categoría</span>
    </button>
  </app-page-header>

  @if (loading()) {
    <div class="grid min-h-64 place-items-center rounded-lg border border-border bg-surface">
      <div class="flex items-center gap-3 text-muted">
        <div
          class="size-6 animate-spin rounded-full border-2 border-border border-t-brand-600"
        ></div>
        <span class="text-sm">Cargando categorías…</span>
      </div>
    </div>
  } @else if (showError()) {
    <div
      class="flex min-h-64 items-center justify-center rounded-lg border border-border bg-surface"
    >
      <app-empty-state
        icon="error_outline"
        title="No se pudieron cargar las categorías"
        [message]="store.error() ?? ''"
      >
        <button
          type="button"
          class="rounded-md bg-brand-600 px-3 py-2 text-sm font-medium text-white hover:bg-brand-700"
          (click)="retry()"
        >
          Reintentar
        </button>
      </app-empty-state>
    </div>
  } @else if (showTable()) {
    <div class="overflow-hidden rounded-lg border border-border bg-surface">
      <app-data-table
        [columns]="columns"
        [rows]="store.sortedItems()"
        [actions]="actions"
        [loading]="store.isLoading()"
        (actionClicked)="onAction($event)"
      />
    </div>
  } @else {
    <div
      class="flex min-h-64 items-center justify-center rounded-lg border border-border bg-surface"
    >
      <app-empty-state
        icon="category"
        title="Sin categorías"
        message="Aún no hay categorías registradas."
      >
        <button
          type="button"
          class="rounded-md bg-brand-600 px-3 py-2 text-sm text-white hover:bg-brand-700"
          (click)="openCreate()"
        >
          Crear categoría
        </button>
      </app-empty-state>
    </div>
  }
</div>
