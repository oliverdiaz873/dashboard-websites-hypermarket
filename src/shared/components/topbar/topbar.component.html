<header class="hs-topbar">
  <div class="hs-topbar__section">
    @if (sidebarStore.isMobile()) {
      <button
        type="button"
        mat-icon-button
        (click)="sidebarStore.setMobileOpen(true)"
        aria-label="Abrir menú"
        [attr.aria-expanded]="sidebarStore.isMobileOpen()"
      >
        <mat-icon aria-hidden="true">menu</mat-icon>
      </button>
    }
    <app-breadcrumb />
  </div>

  <div class="hs-topbar__section">
    <app-global-search />
    <button
      type="button"
      mat-icon-button
      (click)="toggleTheme()"
      [matTooltip]="
        themeManager.resolvedTheme() === 'dark' ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro'
      "
      [attr.aria-label]="
        themeManager.resolvedTheme() === 'dark' ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro'
      "
    >
      <mat-icon aria-hidden="true">
        {{ themeManager.resolvedTheme() === 'dark' ? 'light_mode' : 'dark_mode' }}
      </mat-icon>
    </button>

    <button
      type="button"
      mat-icon-button
      matTooltip="Notificaciones"
      aria-label="Notificaciones"
      [matBadge]="notificationsStore.unreadCount()"
      [matBadgeHidden]="notificationsStore.unreadCount() === 0"
      (click)="notificationsStore.clear()"
    >
      <mat-icon aria-hidden="true">notifications</mat-icon>
    </button>

    <button
      type="button"
      class="flex items-center gap-2 rounded-full p-1 transition-colors hover:bg-surface-alt"
      [matMenuTriggerFor]="userMenu"
      aria-label="Menú de usuario"
    >
      <span
        class="grid size-8 place-items-center rounded-full bg-brand-600 text-white"
        aria-hidden="true"
      >
        <mat-icon class="hs-topbar__avatar-icon">person</mat-icon>
      </span>
      <span class="hidden text-sm font-medium text-neutral-900 dark:text-neutral-100 lg:block">
        {{ authStore.currentUser()?.name ?? 'Administrador' }}
      </span>
    </button>

    <mat-menu #userMenu="matMenu">
      <button mat-menu-item disabled>
        <mat-icon aria-hidden="true">account_circle</mat-icon>
        <span>{{ authStore.currentUser()?.email ?? 'Sin sesión' }}</span>
      </button>
      <mat-divider />
      <button mat-menu-item (click)="onLogout()">
        <mat-icon aria-hidden="true">logout</mat-icon>
        <span>Cerrar sesión</span>
      </button>
    </mat-menu>
  </div>
</header>
