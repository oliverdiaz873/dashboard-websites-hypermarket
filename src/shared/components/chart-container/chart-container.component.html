<div class="flex h-full flex-col gap-3 rounded-xl border border-border bg-surface p-4 shadow-sm">
  <div class="flex flex-col gap-0.5">
    <span class="text-sm font-medium text-foreground">{{ title() }}</span>
    @if (subtitle()) {
      <span class="text-xs text-muted">{{ subtitle() }}</span>
    }
  </div>

  @if (loading()) {
    <div class="grid min-h-40 flex-1 place-items-center">
      <div class="flex items-center gap-3 text-muted">
        <div
          class="size-5 animate-spin rounded-full border-2 border-border border-t-brand-600"
        ></div>
        <span class="text-sm">Cargando…</span>
      </div>
    </div>
  } @else if (isEmpty()) {
    <div class="grid min-h-40 flex-1 place-items-center">
      <app-empty-state icon="insights" title="Sin datos" [message]="emptyMessage()" />
    </div>
  } @else {
    <div class="min-h-40 flex-1">
      <ng-content />
    </div>
  }
</div>
