<nav aria-label="Miga de pan" class="flex min-w-0 items-center gap-1 text-sm leading-none">
  @for (crumb of crumbs(); track $index) {
    @if (crumb.route && !$last) {
      <a
        [routerLink]="crumb.route"
        class="shrink-0 text-muted transition-colors hover:text-neutral-900 dark:hover:text-neutral-100"
      >
        {{ crumb.label }}
      </a>
    } @else if ($last) {
      <span class="shrink-0 text-muted" aria-current="page">{{ crumb.label }}</span>
    } @else {
      <span class="shrink-0 text-muted">{{ crumb.label }}</span>
    }
    @if (!$last) {
      <mat-icon class="shrink-0 text-muted" aria-hidden="true">chevron_right</mat-icon>
    }
  }
</nav>
